# Document Server assets requested at the origin root (no /eurooffice prefix).
# The editor iframe still fetches /sdkjs/, /fonts/, /doc/ and versioned /9.x.x-<hash>/
# paths from the site origin; without these locations Flask returns HTML 404
# (MIME mismatch, WebSocket "Verbindung fehlgeschlagen").
#
# Print uses /printfile/... at the origin root (not under /eurooffice).
# Convert uses /ConvertService.ashx at the origin root.
#
# proxy_pass without a URI forwards the original path to 127.0.0.1:8080.

# Print PDF preview (Datei -> Drucken in EuroOffice Docs)
location /printfile {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    proxy_buffering off;
    proxy_request_buffering off;
}

# Document conversion service (Download as / Print pipeline)
location /ConvertService.ashx {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
    proxy_buffering off;
    proxy_request_buffering off;
}

location ~ ^/[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_request_buffering off;
    # Chrome: unload opt-in for Document Server editor iframe (app.js)
    add_header Permissions-Policy "unload=(self)" always;
}

# SDK font loader sometimes requests /sdkjs/fonts/NNN; files live at /fonts/NNN.
location /sdkjs/fonts/ {
    proxy_pass http://127.0.0.1:8080/fonts/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600;
}

