{# Label element item for the sidebar list #}
<div class="label-designer-element-item" 
     data-element-id="{{ element.id }}"
     onclick="window.selectElement && window.selectElement({{ element.id }})"
     {% if selected_element_id == element.id %}style="background: var(--bs-primary-subtle); border: 1px solid var(--bs-primary);"{% endif %}>
    <div class="d-flex justify-content-between align-items-center">
        <div class="flex-grow-1 min-width-0">
            <strong class="d-block text-truncate">{{ element.element_type }}</strong>
            <div class="text-muted small text-truncate">
                {% if element.content %}
                {{ element.content }}
                {% else %}
                {{ _('inventory.labels.designer.element_content_empty') }}
                {% endif %}
            </div>
        </div>
        <div class="flex-shrink-0">
            <button type="button" class="btn btn-xs btn-outline-primary label-element-edit-btn"
                    data-element-id="{{ element.id }}"
                    title="{{ _('common.edit') }}">
                <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="btn btn-xs btn-outline-danger label-element-delete-btn"
                    data-element-id="{{ element.id }}"
                    title="{{ _('common.delete') }}">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
</div>
